<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">The Last Monsoon — India, 1857</title>
  <desc id="desc">A cinematic illustrated landscape with layered hills, a winding river, atmospheric haze, scattered trees, and the title The Last Monsoon in elegant serif typography.</desc>
  <defs>
    <!-- Sky gradient — deep teal to amber horizon -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#0a1c1e"/>
      <stop offset="0.45" stop-color="#1a3538"/>
      <stop offset="0.72" stop-color="#2d4a46"/>
      <stop offset="1" stop-color="#6e6845"/>
    </linearGradient>
    <!-- River shimmer -->
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#c4b77a"/>
      <stop offset="1" stop-color="#5a7e76"/>
    </linearGradient>
    <!-- Left-side text shade overlay -->
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#0a1a1d" stop-opacity=".92"/>
      <stop offset=".55" stop-color="#0a1a1d" stop-opacity=".50"/>
      <stop offset="1" stop-color="#0a1a1d" stop-opacity=".03"/>
    </linearGradient>
    <!-- Vignette -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="72%">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".55"/>
    </radialGradient>
    <!-- Moon glow -->
    <radialGradient id="moonglow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f0d890" stop-opacity=".35"/>
      <stop offset="1" stop-color="#f0d890" stop-opacity="0"/>
    </radialGradient>
    <!-- Gold horizontal line gradient -->
    <linearGradient id="goldline" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#d5a96e" stop-opacity="0"/>
      <stop offset=".2" stop-color="#d5a96e" stop-opacity="1"/>
      <stop offset=".8" stop-color="#d5a96e" stop-opacity="1"/>
      <stop offset="1" stop-color="#d5a96e" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="420" fill="url(#sky)"/>

  <!-- Moon -->
  <circle cx="940" cy="82" r="80" fill="url(#moonglow)"/>
  <circle cx="940" cy="82" r="30" fill="#ecd580" opacity=".72"/>

  <!-- Stars -->
  <g fill="#f0e8c0" opacity=".4">
    <circle cx="120" cy="28" r="1.2"/>
    <circle cx="310" cy="55" r="1"/>
    <circle cx="480" cy="18" r="1.3"/>
    <circle cx="620" cy="42" r=".9"/>
    <circle cx="780" cy="30" r="1.1"/>
    <circle cx="1050" cy="25" r="1"/>
    <circle cx="1140" cy="60" r="1.2"/>
    <circle cx="200" cy="72" r=".8"/>
    <circle cx="860" cy="52" r="1"/>
  </g>

  <!-- Distant hills layer 1 -->
  <path d="M0 245 100 218 200 238 330 195 460 225 580 185 720 218 860 178 1000 210 1120 185 1200 205V420H0Z" fill="#304542" opacity=".85"/>

  <!-- Mid hills layer 2 -->
  <path d="M0 278 130 258 260 280 400 232 550 268 690 228 850 275 1000 238 1120 265 1200 248V420H0Z" fill="#243a38"/>

  <!-- Near terrain -->
  <path d="M0 322c160-22 270-40 400-25 130 15 200 32 340 14 170-22 300-12 460 8v101H0Z" fill="#162e2c"/>

  <!-- River -->
  <path d="M1200 308c-140 14-240 46-385 50-140 4-210-16-345-3-130 14-240 42-470 35v30h1200Z" fill="url(#river)" opacity=".75"/>

  <!-- River reflection highlight -->
  <path d="M0 392c210 8 325-26 475-35 130-8 220 14 330 8 170-10 250-44 395-50" fill="none" stroke="#e8d6a0" stroke-width="2.5" opacity=".30"/>

  <!-- Trees silhouettes -->
  <g fill="#0f2826" opacity=".88">
    <!-- Tree cluster right -->
    <path d="M890 308v-48m-28 18 28-48 30 49z" stroke="#0f2826" stroke-width="6"/>
    <path d="M930 312v-35m-20 12 20-36 22 37z" stroke="#0f2826" stroke-width="5"/>
    <path d="M1060 298v-58m-36 26 36-56 37 58z" stroke="#0f2826" stroke-width="6"/>
    <path d="M1100 305v-40m-24 16 24-42 25 43z" stroke="#0f2826" stroke-width="5"/>
    <!-- Tree cluster left far -->
    <path d="M760 315v-38m-22 16 22-40 24 40z" stroke="#0f2826" stroke-width="5"/>
  </g>

  <!-- Atmospheric haze band -->
  <rect y="195" width="1200" height="60" fill="#2d4a46" opacity=".18"/>

  <!-- Vignette overlay -->
  <rect width="1200" height="420" fill="url(#vignette)"/>

  <!-- Left shade for text readability -->
  <rect width="1200" height="420" fill="url(#shade)"/>

  <!-- ─── Typography ─── -->

  <!-- Top label: INDIA · 1857 -->
  <text x="68" y="60" fill="#d5a96e" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" font-weight="600" letter-spacing="6">INDIA · 1857</text>

  <!-- Gold accent line under top label -->
  <line x1="68" y1="68" x2="190" y2="68" stroke="url(#goldline)" stroke-width="2"/>

  <!-- Main title -->
  <text x="64" y="148" fill="#faf2df" font-family="Georgia, 'Playfair Display', 'Times New Roman', serif" font-size="68" font-weight="700" letter-spacing="2">THE LAST</text>
  <text x="64" y="228" fill="#faf2df" font-family="Georgia, 'Playfair Display', 'Times New Roman', serif" font-size="68" font-weight="700" letter-spacing="2">MONSOON</text>

  <!-- Gold decorative rule under title -->
  <line x1="68" y1="248" x2="380" y2="248" stroke="#d5a96e" stroke-width="2" opacity=".7"/>

  <!-- Subtitle -->
  <text x="68" y="280" fill="#e0cfa5" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" letter-spacing="4">A HISTORICAL OPEN-WORLD SURVIVAL GAME</text>

  <!-- Tagline -->
  <text x="68" y="355" fill="#b8c9c0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" font-weight="400" letter-spacing="4">SURVIVE THE LAND  ·  PROTECT YOUR PEOPLE</text>

  <!-- Build badge -->
  <text x="68" y="400" fill="#8a9e96" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="11" font-weight="400" letter-spacing="3">PRE-ALPHA  ·  GODOT ENGINE</text>
</svg>
